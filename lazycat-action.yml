version: 2

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/peter.lazycat.app.trilium.lpk
  target_arch: amd64

source:
  kind: git
  url: https://github.com/TriliumNext/Trilium.git
  select:
    strategy: semver-tag
    # Trilium stable releases use v-prefixed tags. Exclude nightly, RC, beta and other prereleases.
    tag_regex: '^v[0-9]+\.[0-9]+\.[0-9]+$'

changelog:
  mode: github-release
  git_url: https://github.com/TriliumNext/Trilium.git

state:
  file: .lazycat-action.lock.yml

update:
  strategy: publish
  allow_downgrade: false

build:
  run_buildscript: false
  prepare:
    mode: images

images:
  - id: trilium
    target: service
    service: trilium
    # {tag} preserves the v prefix used by the official Docker tags.
    source: docker.io/triliumnext/trilium:{tag}
    delivery:
      mode: lazycat
      copy_timeout: 30m
      copy_idle_timeout: 10m

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    continue_if_newer_version: true
    create_if_missing: false
