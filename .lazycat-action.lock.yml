    changelog: "Upstream 0.107.1\n# v0.107.0\n> [!NOTE]\n> If you enjoyed this release, consider showing a token of appreciation by:\n> \n> *   Pressing the “Star” button on [GitHub](https://github.com/TriliumNext/Trilium) (top-right).\n> *   Considering a one-time or recurrent donation to the [lead developer](https://github.com/eliandoran) via [GitHub Sponsors](https://github.com/sponsors/eliandoran) or [PayPal](https://paypal.me/eliandoran).\n\n> [!TIP]\n> For Linux users: Trilium is now available on [Flathub](https://flathub.org/en/apps/org.triliumnotes.Trilium)!\n\nThis is the release where a text note stops being a single document. Notes can be embedded, quoted and referenced inside other notes and edited where they appear, laid out in columns and tabs, and mixed with drawings, attached files and video. Tables in text notes get the tools they had been missing, from merged cells to sorting, and the old layout is gone, a year after the new one replaced it.\n\nAround the editor, the parts of the app that everyone touches were rebuilt: the context menus and the note autocomplete, the full search and the jump dialog, the launch bar and the tree. Shared pages look like the app again and render collections with their own views, and the calendar and geo map collections get the properties dialogs the board already had.\n\nThe AI integration becomes something to trust with a real database: every tool call asks before it reads or changes a note, a ChatGPT Codex subscription can stand in for an API key, and local models get web search through a search engine of your choice. On phones, iOS has a new layout and both apps navigate without a sidebar.\n\n## \U0001F4A1 Key highlights\n\n### The text editor became a block editor\n\nA text note used to be a document: one body of rich text, with other notes reachable only through links. It is now a composition. A note can embed another note and let you edit it where it sits, quote a few of its blocks and keep the quote current, or point at one paragraph of it instead of at the whole note.\n\n*   [Editable transclusion](https://github.com/TriliumNext/Trilium/pull/11926): an included text or code note is edited inside the host note with the full editor, and one undo history covers both.\n*   [Live excerpts](https://github.com/TriliumNext/Trilium/pull/11925) quote blocks of another note. They stay in sync, and an edit made in the excerpt is saved back to the source.\n*   [Block references](https://github.com/TriliumNext/Trilium/pull/12069) link to a paragraph, heading, table or range of blocks. The target opens scrolled to the block and highlighted, and on a shared page every block has a public link of its own.\n\nLayout caught up with content. [Multicolumn layouts](https://github.com/TriliumNext/Trilium/pull/11958) put two to four columns side by side and stack them on narrow screens. [Drawing canvases](https://github.com/TriliumNext/Trilium/pull/11829) are sketched in place with Excalidraw and saved with the note. Files are [attached](https://github.com/TriliumNext/Trilium/pull/11795) in one step, as inline embeds for PDFs and spreadsheets or as links, and YouTube videos and web audio or video play inside the note. A block handle moves blocks, images and tables, a \"+\" on an empty line opens the slash commands, and one [link dialog](https://github.com/TriliumNext/Trilium/pull/12358) serves web links, note links and anchors from a popover at the cursor.\n\nThe include box itself was [reworked](https://github.com/TriliumNext/Trilium/pull/11798): a compact title row with a caption, fullscreen, a link from the embed to its note and back, Markdown included as source, split or preview, code with folding and line numbers, and resizing by dragging a corner or an edge.\n\nContributed by @adoriandoran.\n\n### Tables in text notes\n\nTables were the editor's weak spot: no merged cells, no sorting, and anything past a few rows meant switching to a spreadsheet note. The [table context menu](https://github.com/TriliumNext/Trilium/pull/11774) now merges and unmerges cells, distributes columns, and inserts or deletes many rows and columns at once. A column sorts by its values, with dates, times, numbers and text detected and ordered per the note's language, and Alt+arrows move rows and columns while keeping merged cells and header rows intact.\n\nWide tables scroll sideways under a sticky header, and on touch screens a column bar resizes and selects columns while corner handles select cell ranges. The insert form takes any size up to 1000 × 100, with header rows and columns.\n\nContributed by @adoriandoran.\n\n### AI that asks before it acts\n\nTwo things kept many users away from the AI integration: paying per token, and handing a model write access to their notes. Both change in this release.\n\nChatGPT Codex subscriptions, including the free plan, and OpenRouter join Claude Code, GitHub Copilot and Antigravity as providers, so an existing subscription can drive Trilium's chat. [Custom search engines](https://github.com/TriliumNext/Trilium/pull/11878) (Brave Search, Tavily, Exa, Serper, Perplexity, or a self-hosted SearXNG) give web search to local models and to providers that have none of their own, such as DeepSeek.\n\n[Before a tool runs](https://github.com/TriliumNext/Trilium/pull/12116), the chat shows what the AI is about to read or change and waits for you to allow or deny it, for that call or for the rest of the conversation. The Tools menu sets the default: always ask, ask only before changes, or never ask. It works the same with API keys and with subscription providers.\n\n### Shared pages look like the app\n\nA note shared to the web rendered in a theme of its own, and a shared collection appeared as a plain list of its children. Shared pages now use a [theme built from the app's own look](https://github.com/TriliumNext/Trilium/pull/11979), in light and dark, and a shared board, table, calendar or other collection renders with the same view it has inside Trilium.\n\nDrawings appear as theme-aware SVG pictures instead of a download link, and every block of a shared note has a public link, copied from its block handle, that opens the page scrolled to that block.\n\n### Mobile without the sidebar\n\nOn a phone, the sidebar was both the note tree and the only way around the app, and it covered the note every time it opened. The iOS and Android apps get a [navigation system that does without it](https://github.com/TriliumNext/Trilium/pull/12279), and iOS gets a [layout redesigned](https://github.com/TriliumNext/Trilium/pull/12263) in the style of iOS 26.\n\nWhile editing, the formatting toolbar floats over the note as a compact island, shown only while you type, and brings the widget, link and list toolbars along.\n\n## \U0001F504 Compatibility\n\n*   The sync protocol version went from 39 to 41: instances on different versions cannot sync with each other, so update the server and every desktop and mobile client together.\n    *   [The sync protocol was extended so that the reworked include notes sync without risking data loss between clients, which is why this release raises its version.](https://github.com/TriliumNext/Trilium/pull/11798)\n*   The database version went from 240 to 242: the database is migrated the first time this version opens it, after an automatic backup, and an earlier version refuses to open it afterwards.\n*   The Docker image has been reworked so that it can run as a non-root user. Look for the corresponding section in the [Docker setup documentation](https://docs.triliumnotes.org/user-guide/setup/server/installation/docker). ([#5790](https://github.com/TriliumNext/Trilium/issues/5790))\n\n## \U0001F6A8 Breaking changes\n\n*   The old layout has been removed. It's been almost a year since the new layout was introduced and we believe it has been polished enough to see day-to-day use. For more information, see the [corresponding GitHub Discussions post](https://github.com/orgs/TriliumNext/discussions/11891).\n*   Multi-level `#sorted` values introduced in v0.106.0 must now write labels with `#`, as search's `orderBy` does: `#sorted=\"priority desc, dueDate\"` becomes `#sorted=\"#priority desc, #dueDate\"`. Values without `#` fall back to sorting by title. A single name (`#sorted=myOrder`) and property-only values (`dateModified desc, title`) are unaffected. See [Sorting Notes](https://docs.triliumnotes.org/user-guide/concepts/notes/sorting).\n*   `POST /etapi/auth/login` now requires a code if TOTP is enabled. Check the API documentation for more information.\n\n## \U0001F4F1 Mobile improvements\n\n1.  [Android Tablet: Note menu not scrollable](https://github.com/TriliumNext/Trilium/issues/11106)\n2.  The text formatting toolbar on phones floats over the note as a compact island, shows only while editing, and brings the widget, link and list toolbars along. ([#12184](https://github.com/TriliumNext/Trilium/pull/12184), [#12187](https://github.com/TriliumNext/Trilium/pull/12187))\n3.  [The sidebar toggle does nothing on tablets](https://github.com/TriliumNext/Trilium/issues/12233) by @6801318d8d\n4.  [Android Back button exits the app instead of closing open menus](https://github.com/TriliumNext/Trilium/issues/12216)\n5.  [Mobile UI: Add a way to return to the currently open note](https://github.com/TriliumNext/Trilium/issues/12306)\n6.  [Table of Content visibility toggle for smartphone/mobile screens](https://github.com/TriliumNext/Trilium/issues/8974)\n\n## \U0001F41E Bugfixes\n\n1.  [Searching protected notes failed on synced instances.](https://github.com/TriliumNext/Trilium/issues/8491)\n2.  Interface: [Keyboard shortcuts did not work on non-Latin layouts (Russian, Greek).](https://github.com/TriliumNext/Trilium/issues/11846)\n3.  [Sync could lose note modifications.](https://github.com/TriliumNext/Trilium/issues/12173)\n4.  Interface: [Opening Settings froze the app for about six seconds on Windows.](https://github.com/TriliumNext/Trilium/issues/12518)\n5.  Authentication: Logging in through OIDC failed since v0.105.0 behind Nginx Proxy Manager (\"auth_verification cookie not found\") and with Pocket ID. ([#11234](https://github.com/TriliumNext/Trilium/issues/11234), [#12301](https://github.com/TriliumNext/Trilium/issues/12301))\n6.  LLM: [Chrome and Edge crashed (STATUS_BREAKPOINT) when opening notes with the AI integration enabled.](https://github.com/TriliumNext/Trilium/issues/12021)\n7.  Markdown: [Importing Markdown turned any text containing `$` into a math equation.](https://github.com/TriliumNext/Trilium/issues/5682) by @SulimanAbdulrazzaq\n\n<details>\n    <summary>Tree (6)</summary>\n    <ol>\n        <li><a href=\"https://github.com/TriliumNext/Trilium/issues/11732\">Left sidebar spacing is too large compared with the previous version at larger font sizes</a></li>\n        <li><a href=\"https://github.com/TriliumNext/Trilium/issues/12220\">Editing reopens collapsed ancestors with “Follow active note” disabled</a></li>\n        <li><a href=\"https://github.com/TriliumNext/Trilium/issues/7288\">Ghost note remains when moving multiple notes into a newly created note (not yet a folder)</a></li>\n        <li><a href=\"https://github.com/TriliumNext/Trilium/pull/11900\">Expand/collapse subtree didn't work correctly in some circumstances</a></li>\n        <li>Adding sub-children to a note would not re-sort when <code>#sortFoldersFirst</code> was set.</li>\n        <li>Deleting the last item of the root would reveal the hidden notes.</li>\n    </ol>\n</details>\n\n<details>\n    <summary>Printing (3)</summary>\n    <ol>\n        <li><a href=\"https://github.com/TriliumNext/Trilium/issues/11733\">Print preview gets stuck and leaves an unresponsive dot/element</a></li>\n        <li>Some issues with printing: <a href=\"https://github.com/TriliumNext/Trilium/issues/9164\">wide images would make scale the text too small</a>, keyboard shortcuts lacked styling and Gantt Mermaid charts would not render when printing on the browser.</li>\n        <li><a href=\"https://github.com/TriliumNext/Trilium/issues/12313\">Print/PDF ignores ~printCss when Trilium is served from a subpath (absolute /api URL 404s)</a> by @pcbeingused333</li\n\n…"
