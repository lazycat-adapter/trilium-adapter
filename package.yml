package: peter.lazycat.app.trilium
version: 0.107.1
name: Trilium Notes
description: 本地优先的层级化笔记与个人知识库应用。
homepage: https://triliumnotes.org
author: TriliumNext
license: AGPL-3.0
min_os_version: 1.5.0
unsupported_platforms:
  - android
  - ios
locales:
  zh-CN:
    name: Trilium Notes
    description: 本地优先的层级化笔记与个人知识库应用。
    usage: |
      首次打开后按向导创建管理员账户。
      笔记、附件、数据库、配置和索引持久保存在 /lzcapp/var/trilium。
      应用支持中文界面、全文搜索、笔记同步、附件和导入导出。
  en-US:
    name: Trilium Notes
    description: A local-first hierarchical note-taking application and personal knowledge base.
    usage: |
      Complete the initial administrator setup after opening the application.
      Notes, attachments, database, configuration and indexes persist under /lzcapp/var/trilium.
      The application supports Chinese UI, full-text search, synchronization, attachments, and import/export.
permissions:
  required:
    - net.internet
  optional:
    - net.lan
